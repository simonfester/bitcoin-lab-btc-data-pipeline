# Bitcoin Lab API - Metrics Configuration
# =========================================
# Defines all metrics to download, their endpoints, and priorities
# Priority levels: critical (always update first), high, medium, low

api:
  base_url: https://api.researchbitcoin.net
  version: v2
  token_env: BITCOIN_LAB_TOKEN  # Environment variable name
  rate_limit_per_minute: 60
  quota_weekly: 40_000_000

defaults:
  resolution: d1
  output_format: json
  start_date: "2015-01-01"  # Default backfill start

# ============================================================================
# METRICS REGISTRY
# ============================================================================
# Each metric has:
#   - endpoint: API endpoint path (under /v2/)
#   - data_field: specific field to request
#   - priority: critical | high | medium | low
#   - description: what this metric measures
#   - tier: API tier required (0, 1, or 2)
#   - resolutions: supported resolutions (verified 2026-01-29)
# ============================================================================

metrics:

  # ==========================================================================
  # PRICE & MARKET DATA (Critical - needed for all strategies)
  # ==========================================================================

  - name: price
    endpoint: price
    data_field: price
    priority: critical
    tier: 0
    description: "BTC price in USD"
    resolutions: [d1, h1, h4, h8, h12]

  - name: market_cap
    endpoint: marketcap
    data_field: market_cap
    priority: critical
    tier: 0
    description: "Total market capitalization"
    resolutions: [d1, h1]

  # ==========================================================================
  # VALUATION METRICS (High - core on-chain signals)
  # ==========================================================================

  - name: mvrv
    endpoint: market_value_to_realized_value
    data_field: mvrv
    priority: high
    tier: 1
    description: "Market Value to Realized Value ratio"
    resolutions: [d1, h1, h4, h8, h12]

  - name: mvrv_z
    endpoint: market_value_to_realized_value
    data_field: mvrv_z
    priority: high
    tier: 1
    description: "MVRV Z-Score (standardized)"
    resolutions: [d1, h1]

  - name: mvrv_lth
    endpoint: market_value_to_realized_value
    data_field: mvrv_lth
    priority: high
    tier: 2
    description: "MVRV for Long-Term Holders"
    resolutions: [d1, h1]

  - name: mvrv_sth
    endpoint: market_value_to_realized_value
    data_field: mvrv_sth
    priority: high
    tier: 2
    description: "MVRV for Short-Term Holders"
    resolutions: [d1, h1, h4, h8, h12]

  - name: nvt
    endpoint: network_value_to_transaction
    data_field: nvt
    priority: high
    tier: 1
    description: "Network Value to Transaction ratio"
    resolutions: [d1, h1]

  - name: velocity
    endpoint: network_value_to_transaction
    data_field: velocity
    priority: medium
    tier: 1
    description: "Monetary velocity"
    resolutions: [d1, h1]

  # ==========================================================================
  # PROFIT/LOSS METRICS (High - sentiment indicators)
  # ==========================================================================

  - name: sopr
    endpoint: spent_output_profit_ratio
    data_field: sopr
    priority: high
    tier: 1
    description: "Spent Output Profit Ratio"
    resolutions: [d1, h1, h4, h8, h12]

  - name: sopr_lth
    endpoint: spent_output_profit_ratio
    data_field: sopr_lth
    priority: high
    tier: 2
    description: "SOPR for Long-Term Holders"
    resolutions: [d1, h1, h4, h8, h12]

  - name: sopr_sth
    endpoint: spent_output_profit_ratio
    data_field: sopr_sth
    priority: high
    tier: 2
    description: "SOPR for Short-Term Holders"
    resolutions: [d1, h1, h4, h8, h12]

  - name: nupl
    endpoint: net_unrealized_profit_loss
    data_field: net_unrealized_profit_loss
    priority: high
    tier: 1
    description: "Net Unrealized Profit/Loss"
    resolutions: [d1, h1]

  - name: nupl_lth
    endpoint: net_unrealized_profit_loss
    data_field: net_unrealized_profit_loss_lth
    priority: high
    tier: 2
    description: "NUPL for Long-Term Holders"
    resolutions: [d1, h1]

  - name: nupl_sth
    endpoint: net_unrealized_profit_loss
    data_field: net_unrealized_profit_loss_sth
    priority: high
    tier: 2
    description: "NUPL for Short-Term Holders"
    resolutions: [d1, h1]

  - name: net_realized_pnl
    endpoint: net_realized_profit_loss
    data_field: net_realized_profit_loss
    priority: high
    tier: 1
    description: "Net Realized Profit/Loss"
    resolutions: [d1, h1]

  # ==========================================================================
  # SUPPLY METRICS (High - holder behavior)
  # ==========================================================================

  - name: supply_in_profit
    endpoint: supply_in_profitloss
    data_field: supply_in_profit
    priority: high
    tier: 1
    description: "Supply currently in profit"
    resolutions: [d1, h1]

  - name: supply_in_profit_percent
    endpoint: supply_in_profitloss
    data_field: supply_in_profit_percent
    priority: high
    tier: 1
    description: "Percentage of supply in profit"
    resolutions: [d1, h1]

  - name: supply_in_loss
    endpoint: supply_in_profitloss
    data_field: supply_in_loss
    priority: medium
    tier: 1
    description: "Supply currently in loss"
    resolutions: [d1, h1]

  - name: supply_lth
    endpoint: supply_distribution
    data_field: supply_lth
    priority: high
    tier: 1
    description: "Long-Term Holder supply"
    resolutions: [d1, h1]

  - name: supply_sth
    endpoint: supply_distribution
    data_field: supply_sth
    priority: high
    tier: 1
    description: "Short-Term Holder supply"
    resolutions: [d1, h1]

  - name: supply_lth_sth_ratio
    endpoint: supply_distribution
    data_field: supply_lth_sth_ratio
    priority: high
    tier: 1
    description: "LTH to STH supply ratio"
    resolutions: [d1, h1]

  - name: supply_total
    endpoint: supply_distribution
    data_field: supply_total
    priority: medium
    tier: 0
    description: "Total circulating supply"
    resolutions: [d1, h1]

  # ==========================================================================
  # REALIZED CAP & PRICE (High - cost basis analysis)
  # ==========================================================================

  - name: realized_cap
    endpoint: realizedcap
    data_field: realized_cap
    priority: high
    tier: 1
    description: "Realized capitalization"
    resolutions: [d1, h1]

  - name: realized_cap_lth
    endpoint: realizedcap
    data_field: realized_cap_lth
    priority: medium
    tier: 2
    description: "Realized cap for LTH"
    resolutions: [d1, h1]

  - name: realized_cap_sth
    endpoint: realizedcap
    data_field: realized_cap_sth
    priority: medium
    tier: 2
    description: "Realized cap for STH"
    resolutions: [d1, h1]

  - name: realized_price
    endpoint: realizedprice
    data_field: realized_price
    priority: high
    tier: 1
    description: "Aggregate realized price (cost basis)"
    resolutions: [d1, h1]

  - name: realized_price_lth
    endpoint: realizedprice
    data_field: realized_price_lth
    priority: medium
    tier: 2
    description: "Realized price for LTH"
    resolutions: [d1, h1]

  - name: realized_price_sth
    endpoint: realizedprice
    data_field: realized_price_sth
    priority: medium
    tier: 2
    description: "Realized price for STH"
    resolutions: [d1, h1]

  # ==========================================================================
  # COINTIME ECONOMICS (Medium - advanced analysis)
  # ==========================================================================

  - name: liveliness
    endpoint: cointime_statistics
    data_field: liveliness
    priority: medium
    tier: 1
    description: "Network economic activity measure"
    resolutions: [d1, h1]

  - name: vaultedness
    endpoint: cointime_statistics
    data_field: vaultedness
    priority: medium
    tier: 1
    description: "Proportion of inactive/dormant supply"
    resolutions: [d1, h1]

  - name: supply_active
    endpoint: cointime_statistics
    data_field: supply_active
    priority: medium
    tier: 1
    description: "Actively participating supply"
    resolutions: [d1, h1]

  - name: supply_vaulted
    endpoint: cointime_statistics
    data_field: supply_vaulted
    priority: medium
    tier: 1
    description: "Dormant/vaulted supply"
    resolutions: [d1, h1]

  - name: true_market_mean_price
    endpoint: cointime_statistics
    data_field: true_market_meanprice
    priority: medium
    tier: 2
    description: "Cost basis of actively traded supply"
    resolutions: [d1, h1]

  - name: investor_cap
    endpoint: cointime_statistics
    data_field: investor_cap
    priority: medium
    tier: 2
    description: "Investor-driven component of realized cap"
    resolutions: [d1, h1]

  - name: thermo_cap
    endpoint: cointime_statistics
    data_field: thermo_cap
    priority: medium
    tier: 1
    description: "Cumulative USD value of all mined BTC"
    resolutions: [d1, h1]

  # ==========================================================================
  # JAMES CHECK "WEN TOP?" FRAMEWORK METRICS (High - professional validation)
  # ==========================================================================
  # These metrics were identified from James Check's Masterclass #21 "Wen Top?"
  # as key indicators for cycle top identification and market positioning.
  # See: research/LESSONS_LEARNED.md for validation notes

  - name: vaulted_price
    endpoint: cointime_statistics
    data_field: vaulted_realized_price
    priority: high
    tier: 2
    description: "Vaulted Realized Price - lower bound of Check's 'topping cloud' where HODLers ramp up profit taking"
    resolutions: [d1, h1]

  - name: aviv
    endpoint: cointime_statistics
    data_field: active_value_to_investor_value
    priority: high
    tier: 2
    description: "AVIV Ratio (Active Value to Investor Value) - Check's preferred MVRV variant for macro cycle analysis"
    resolutions: [d1, h1]

  # ==========================================================================
  # DORMANCY & COIN DAYS (Medium - old coin movement)
  # ==========================================================================

  - name: coindays_destroyed
    endpoint: utxo_dormancy
    data_field: coindays_destroyed
    priority: medium
    tier: 1
    description: "Total coin days destroyed"
    resolutions: [d1, h1]

  - name: asol
    endpoint: utxo_dormancy
    data_field: asol
    priority: medium
    tier: 1
    description: "Average Spent Output Lifespan"
    resolutions: [d1, h1]

  - name: dormancy
    endpoint: utxo_dormancy
    data_field: dormancy_raw
    priority: medium
    tier: 1
    description: "Average age of spent outputs"
    resolutions: [d1, h1]

  # ==========================================================================
  # NETWORK METRICS (Medium - fundamentals)
  # ==========================================================================

  - name: hashrate
    endpoint: network_statistics
    data_field: hashrate
    priority: medium
    tier: 0
