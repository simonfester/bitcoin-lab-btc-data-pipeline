    resolutions: [d1, h1]

  - name: fee_total_usd
    endpoint: fees
    data_field: fee_total_usd
    priority: medium
    tier: 0
    description: "Total transaction fees (USD)"
    resolutions: [d1, h1]

  - name: fee_avg
    endpoint: fees
    data_field: fee_avg
    priority: low
    tier: 0
    description: "Average transaction fee"
    resolutions: [d1, h1]

  # ==========================================================================
  # VOLUME METRICS (Medium - activity measures)
  # ==========================================================================

  - name: volume_btc
    endpoint: volume
    data_field: spent_tx_volume_btc
    priority: medium
    tier: 0
    description: "Transaction volume in BTC"
    resolutions: [d1, h1]

  - name: volume_usd
    endpoint: volume
    data_field: spent_tx_volume_usd
    priority: medium
    tier: 0
    description: "Transaction volume in USD"
    resolutions: [d1, h1]

  - name: volume_btc_adjusted
    endpoint: volume
    data_field: spent_tx_volume_btc_excl_dust
    priority: medium
    tier: 1
    description: "Volume excluding dust"
    resolutions: [d1, h1]

  # ==========================================================================
  # UNREALIZED P&L (Medium - market positioning)
  # ==========================================================================

  - name: unrealized_profit
    endpoint: unrealizedprofit
    data_field: unrealized_profit
    priority: medium
    tier: 1
    description: "Total unrealized profit"
    resolutions: [d1, h1]

  - name: unrealized_loss
    endpoint: unrealizedloss
    data_field: unrealized_loss
    priority: medium
    tier: 1
    description: "Total unrealized loss"
    resolutions: [d1, h1]

  - name: unrealized_cap
    endpoint: unrealizedcap
    data_field: unrealized_cap
    priority: medium
    tier: 1
    description: "Unrealized capitalization"
    resolutions: [d1, h1]

  # ==========================================================================
  # REALIZED P&L (Medium - actual taking of profits/losses)
  # ==========================================================================

  - name: realized_profit
    endpoint: realizedprofit
    data_field: realized_profit
    priority: medium
    tier: 1
    description: "Daily realized profit"
    resolutions: [d1, h1, h4, h8, h12]

  - name: realized_loss
    endpoint: realizedloss
    data_field: realized_loss
    priority: medium
    tier: 1
    description: "Realized loss (USD)"
    resolutions: [d1, h1, h4, h8, h12]
